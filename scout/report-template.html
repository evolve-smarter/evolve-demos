<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one prospect-facing letter. Loss first, then why, then the fix, then the payoff and one button. */
:root{
  --bg:#f7f6fb; --surface:#fff; --sunk:#eeecf6; --line:#dfdcea; --fg:#15131d; --muted:#5d5970;
  --accent:#7c3aed; --accent-ink:#fff; --loss:#c2410c; --loss-bg:#fff1e8; --win:#047857; --win-bg:#e8f7ef;
  --display:'Outfit',ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0b12; --surface:#15141f; --sunk:#1c1a29; --line:#2a2740; --fg:#ece9f7; --muted:#a29dba;
  --accent:#a78bfa; --accent-ink:#120c22; --loss:#fb923c; --loss-bg:#2a1609; --win:#34d399; --win-bg:#0a2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0b12; --surface:#15141f; --sunk:#1c1a29; --line:#2a2740; --fg:#ece9f7; --muted:#a29dba;
  --accent:#a78bfa; --accent-ink:#120c22; --loss:#fb923c; --loss-bg:#2a1609; --win:#34d399; --win-bg:#0a2219; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:16px;line-height:1.55;margin:0}
main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:grid;gap:28px}
h1,h2{margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:clamp(28px,7vw,42px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
section{display:grid;gap:12px}
.loss{background:var(--loss-bg);border-radius:18px;padding:22px;display:grid;gap:8px}
.loss .big{font-size:clamp(48px,14vw,80px);font-weight:800;color:var(--loss);line-height:1;letter-spacing:-.03em}
.loss .big small{font-size:.32em;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.steps div{background:var(--surface);border-radius:10px;padding:10px;display:grid;gap:2px}
.steps b{font-size:20px}
.steps span{font-size:12px;color:var(--muted);line-height:1.3}
.gap{display:grid;grid-template-columns:4px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;overflow:hidden}
.gap i{background:var(--muted)} .gap.high i{background:var(--loss)} .gap.med i{background:#d97706} .gap.low i{background:var(--win)}
.gap p{font-size:14px;color:var(--muted)}
.gap .fix{font-size:13px;color:var(--accent);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.you td{background:var(--loss-bg);font-weight:600}
tr:last-child td{border-bottom:none}
.y{color:var(--win);font-weight:600}.x{color:var(--loss);font-weight:600}
.win{background:var(--win-bg);border-radius:18px;padding:22px;display:grid;gap:14px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio b{display:block;font-size:clamp(24px,7vw,36px);color:var(--win);line-height:1.1}
.trio span{font-size:13px;color:var(--muted)}
.fixes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fixes div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px}
.fixes p{font-size:14px;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:12px;font-weight:700;text-decoration:none;border:1px solid var(--line);color:var(--fg);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.foot a{color:var(--muted)}
@media (max-width:560px){.steps{grid-template-columns:1fr 1fr}.fixes{grid-template-columns:1fr}}
</style>
<main id="r"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById("data").textContent);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Math.round(n).toLocaleString("en-US");
const i=D.inputs, b=D.business, r=D.research||{};
const missed=i.calls*i.miss/100, lostJobs=missed*i.noCallback/100*i.close/100, lost=lostJobs*i.ticket, rec=lost*i.capture/100;
const roi=i.price?rec/i.price:0, payback=rec?Math.max(1,Math.round(i.price/(rec/30))):null;
const yn=v=>v===true?'<span class="y">Yes</span>':v===false?'<span class="x">No</span>':'–';
const comps=r.competitors||[], g=r.google||{}, w=r.website||{};
document.getElementById("r").innerHTML=`
<header style="display:grid;gap:10px">
  <div class="eyebrow">Prepared for ${esc(b.name)} by Evolve</div>
  <h1>${esc(b.name)}, here's what missed calls are costing you</h1>
  <p class="muted">${esc(D.intro||"We looked at your Google profile, your website and the top competitors in your area. Here's what we found.")}</p>
</header>
<div class="loss">
  <div class="eyebrow" style="color:var(--loss)">Estimated revenue lost every month</div>
  <div class="big num">${money(lost)}<small> / month</small></div>
  <p class="muted">That's about ${money(lost*12)} a year walking to the next company on Google.</p>
  <div class="steps num">
    <div><b>${i.calls}</b><span>calls a month</span></div>
    <div><b>${i.miss}%</b><span>go unanswered (industry average)</span></div>
    <div><b>${Math.round(lostJobs*10)/10}</b><span>jobs lost a month</span></div>
    <div><b>${money(i.ticket)}</b><span>average job</span></div>
  </div>
</div>
${(r.gaps||[]).length?`<section><h2>What we found</h2>${r.gaps.map(x=>`<div class="gap ${esc(x.sev)}"><i></i><div><b>${esc(x.title)}</b><p>${esc(x.detail)}</p></div></div>`).join("")}</section>`:""}
${comps.length?`<section><h2>You vs. the companies winning your calls</h2>
<div class="tw"><table><thead><tr><th>Business</th><th class="n">Rating</th><th class="n">Reviews</th><th>Chat</th><th>Answers after hours</th></tr></thead><tbody>
<tr class="you"><td>${esc(b.name)}</td><td class="n">${g.rating??"–"}</td><td class="n">${g.reviews??"–"}</td><td>${yn(w.chat)}</td><td>${yn(r.afterHours)}</td></tr>
${comps.map(c=>`<tr><td>${esc(c.name)}</td><td class="n">${c.rating??"–"}</td><td class="n">${c.reviews??"–"}</td><td>${yn(c.chat)}</td><td>${yn(c.after)}</td></tr>`).join("")}
</tbody></table></div>${r.compTakeaway?`<p class="muted">${esc(r.compTakeaway)}</p>`:""}</section>`:""}
<section><h2>How Evolve fixes it</h2><div class="fixes">
  <div><b>AI receptionist</b><p>Answers every call in your company's name, day or night, and books the job.</p></div>
  <div><b>Smart website</b><p>Fast, mobile-first site with AI chat that turns visitors into booked calls.</p></div>
  <div><b>Review engine</b><p>Asks every happy customer for a Google review, so you climb the map.</p></div>
  <div><b>Missed-call text back</b><p>Anyone who hangs up gets a text within seconds, before they call someone else.</p></div>
</div></section>
<div class="win">
  <div class="eyebrow" style="color:var(--win)">What it's worth to you</div>
  <div class="trio num"><div><b>${money(rec)}</b><span>recovered a month</span></div><div><b>${Math.round(roi*10)/10}×</b><span>return on Evolve</span></div><div><b>${payback?payback+" days":"–"}</b><span>to pay for itself</span></div></div>
  <p class="muted">One recovered ${esc(D.tradeLabel.toLowerCase())} job (${money(i.ticket)}) covers about ${Math.round(i.ticket/i.price*10)/10} months of Evolve at ${money(i.price)}/mo.</p>
</div>
<section><h2>We already built your demo</h2>
  <p class="muted">See your new website and talk to your AI receptionist before you decide anything.</p>
  <div class="cta">${D.demoUrl?`<a class="btn" href="${esc(D.demoUrl)}" target="_blank" rel="noopener">See your demo site</a>`:""}${D.paymentLink?`<a class="btn primary" href="${esc(D.paymentLink)}" target="_blank" rel="noopener">Get started</a>`:""}</div>
  <p>Questions? Bryce at Evolve${D.contact?": "+esc(D.contact):""}</p>
</section>
<footer class="foot">
  <p>Estimates use industry averages for home service companies and your public Google and website data as of ${esc(D.asOf||"")}. Your own call logs will give the exact number.</p>
  ${(D.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("")}
</footer>`;
</script>
